<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Tuning Fork - Gateway Enhanced</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        const ChevronDown = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        );
        
        const ChevronRight = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        );
        
        const Volume2 = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
        );
        
        const VolumeX = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
        );
        
        const BookOpen = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
        );
        
        const StopCircle = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="12" cy="12" r="10"></circle>
                <rect x="9" y="9" width="6" height="6"></rect>
            </svg>
        );

        const Heart = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
        );

        const HumanTuningFork = () => {
          const [leftFreq, setLeftFreq] = useState(0);
          const [rightFreq, setRightFreq] = useState(0);
          const [volume, setVolume] = useState(40);
          const [leftMuted, setLeftMuted] = useState(false);
          const [rightMuted, setRightMuted] = useState(false);
          const [mode, setMode] = useState('independent');
          const [lockedOffset, setLockedOffset] = useState(0);
          const [pinkNoise, setPinkNoise] = useState(false);
          const [whiteNoise, setWhiteNoise] = useState(false);
          const [brownNoise, setBrownNoise] = useState(false);
          const [noiseVolume, setNoiseVolume] = useState(50);
          const [clickTrack, setClickTrack] = useState(false);
          const [clickStyle, setClickStyle] = useState('click');
          const [clickVolume, setClickVolume] = useState(50);
          const [sessionActive, setSessionActive] = useState(false);
          const [currentSession, setCurrentSession] = useState(null);
          const [currentPhase, setCurrentPhase] = useState(0);
          const [sessionProgress, setSessionProgress] = useState(0);
          const [timeRemaining, setTimeRemaining] = useState('');
          const [showBrainwaveGuide, setShowBrainwaveGuide] = useState(false);
          const [showBackgroundSounds, setShowBackgroundSounds] = useState(false);
          const [showNotes, setShowNotes] = useState(false);
          const [showLeftInput, setShowLeftInput] = useState(false);
          const [showRightInput, setShowRightInput] = useState(false);
          const [wavePhase, setWavePhase] = useState(0);
          
          const audioContextRef = useRef(null);
          const leftOscRef = useRef(null);
          const rightOscRef = useRef(null);
          const leftGainRef = useRef(null);
          const rightGainRef = useRef(null);
          const masterGainRef = useRef(null);
          const sessionIntervalRef = useRef(null);
          const canvasRef = useRef(null);
          const animationRef = useRef(null);
          const pinkNoiseSourceRef = useRef(null);
          const whiteNoiseSourceRef = useRef(null);
          const brownNoiseSourceRef = useRef(null);
          const pinkNoiseGainRef = useRef(null);
          const whiteNoiseGainRef = useRef(null);
          const brownNoiseGainRef = useRef(null);
          const clickIntervalRef = useRef(null);
          
          const GATEWAY_SESSIONS = {
            "Focus 10": [
              { name: "Entry (Alpha)", left: 100, right: 110, duration: 300 },
              { name: "Deep State (Alpha)", left: 100, right: 110, duration: 600 },
              { name: "Return (Alpha)", left: 100, right: 110, duration: 300 }
            ],
            "Focus 12": [
              { name: "Entry (Alpha)", left: 100, right: 110, duration: 180 },
              { name: "Transition (Theta)", left: 100, right: 106, duration: 240 },
              { name: "Deep Theta", left: 100, right: 106, duration: 600 },
              { name: "Return (Alpha)", left: 100, right: 110, duration: 180 }
            ],
            "Focus 15": [
              { name: "Entry (Alpha)", left: 100, right: 110, duration: 180 },
              { name: "Deep Theta", left: 100, right: 105, duration: 300 },
              { name: "Delta State", left: 100, right: 102, duration: 480 },
              { name: "Return (Theta)", left: 100, right: 105, duration: 180 },
              { name: "Return (Alpha)", left: 100, right: 110, duration: 120 }
            ]
          };
          
          const generateNoiseBuffer = (type) => {
            if (!audioContextRef.current) return null;
            const bufferSize = audioContextRef.current.sampleRate * 2;
            const buffer = audioContextRef.current.createBuffer(1, bufferSize, audioContextRef.current.sampleRate);
            const data = buffer.getChannelData(0);
            
            if (type === 'white') {
              for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
              }
            } else if (type === 'pink') {
              let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
              for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + white * 0.0555179;
                b1 = 0.99332 * b1 + white * 0.0750759;
                b2 = 0.96900 * b2 + white * 0.1538520;
                b3 = 0.86650 * b3 + white * 0.3104856;
                b4 = 0.55000 * b4 + white * 0.5329522;
                b5 = -0.7616 * b5 - white * 0.0168980;
                data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
                b6 = white * 0.115926;
              }
            } else if (type === 'brown') {
              let lastOut = 0;
              for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                data[i] = (lastOut + (0.02 * white)) / 1.02;
                lastOut = data[i];
                data[i] *= 3.5;
              }
            }
            return buffer;
          };
		  useEffect(() => {
            const initAudio = () => {
              if (!audioContextRef.current) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioContextRef.current = new AudioContext();
                
                masterGainRef.current = audioContextRef.current.createGain();
                masterGainRef.current.connect(audioContextRef.current.destination);
                masterGainRef.current.gain.value = volume / 200;
                
                leftOscRef.current = audioContextRef.current.createOscillator();
                leftGainRef.current = audioContextRef.current.createGain();
                leftOscRef.current.connect(leftGainRef.current);
                
                const leftMerger = audioContextRef.current.createChannelMerger(2);
                leftGainRef.current.connect(leftMerger, 0, 0);
                leftMerger.connect(masterGainRef.current);
                
                leftOscRef.current.frequency.value = leftFreq;
                leftGainRef.current.gain.value = leftMuted ? 0 : 1;
                leftOscRef.current.start();
                
                rightOscRef.current = audioContextRef.current.createOscillator();
                rightGainRef.current = audioContextRef.current.createGain();
                rightOscRef.current.connect(rightGainRef.current);
                
                const rightMerger = audioContextRef.current.createChannelMerger(2);
                rightGainRef.current.connect(rightMerger, 0, 1);
                rightMerger.connect(masterGainRef.current);
                
                rightOscRef.current.frequency.value = rightFreq;
                rightGainRef.current.gain.value = rightMuted ? 0 : 1;
                rightOscRef.current.start();
                
                pinkNoiseGainRef.current = audioContextRef.current.createGain();
                pinkNoiseGainRef.current.gain.value = 0;
                pinkNoiseGainRef.current.connect(masterGainRef.current);
                
                whiteNoiseGainRef.current = audioContextRef.current.createGain();
                whiteNoiseGainRef.current.gain.value = 0;
                whiteNoiseGainRef.current.connect(masterGainRef.current);
                
                brownNoiseGainRef.current = audioContextRef.current.createGain();
                brownNoiseGainRef.current.gain.value = 0;
                brownNoiseGainRef.current.connect(masterGainRef.current);
              }
            };
            
            const handleUserInteraction = () => {
              initAudio();
              document.removeEventListener('click', handleUserInteraction);
            };
            
            document.addEventListener('click', handleUserInteraction);
            
            return () => {
              document.removeEventListener('click', handleUserInteraction);
              if (audioContextRef.current) {
                audioContextRef.current.close();
              }
            };
          }, []);
          
          useEffect(() => {
            if (!audioContextRef.current || !pinkNoiseGainRef.current) return;
            
            if (pinkNoise) {
              const buffer = generateNoiseBuffer('pink');
              const source = audioContextRef.current.createBufferSource();
              source.buffer = buffer;
              source.loop = true;
              source.connect(pinkNoiseGainRef.current);
              source.start();
              pinkNoiseSourceRef.current = source;
              pinkNoiseGainRef.current.gain.value = noiseVolume / 100 * 0.3;
            } else if (pinkNoiseSourceRef.current) {
              pinkNoiseSourceRef.current.stop();
              pinkNoiseSourceRef.current = null;
              pinkNoiseGainRef.current.gain.value = 0;
            }
          }, [pinkNoise]);
          
          useEffect(() => {
            if (!audioContextRef.current || !whiteNoiseGainRef.current) return;
            
            if (whiteNoise) {
              const buffer = generateNoiseBuffer('white');
              const source = audioContextRef.current.createBufferSource();
              source.buffer = buffer;
              source.loop = true;
              source.connect(whiteNoiseGainRef.current);
              source.start();
              whiteNoiseSourceRef.current = source;
              whiteNoiseGainRef.current.gain.value = noiseVolume / 100 * 0.3;
            } else if (whiteNoiseSourceRef.current) {
              whiteNoiseSourceRef.current.stop();
              whiteNoiseSourceRef.current = null;
              whiteNoiseGainRef.current.gain.value = 0;
            }
          }, [whiteNoise]);
          
          useEffect(() => {
            if (!audioContextRef.current || !brownNoiseGainRef.current) return;
            
            if (brownNoise) {
              const buffer = generateNoiseBuffer('brown');
              const source = audioContextRef.current.createBufferSource();
              source.buffer = buffer;
              source.loop = true;
              source.connect(brownNoiseGainRef.current);
              source.start();
              brownNoiseSourceRef.current = source;
              brownNoiseGainRef.current.gain.value = noiseVolume / 100 * 0.3;
            } else if (brownNoiseSourceRef.current) {
              brownNoiseSourceRef.current.stop();
              brownNoiseSourceRef.current = null;
              brownNoiseGainRef.current.gain.value = 0;
            }
          }, [brownNoise]);
          
          useEffect(() => {
            if (pinkNoiseGainRef.current && pinkNoise) {
              pinkNoiseGainRef.current.gain.value = noiseVolume / 100 * 0.3;
            }
            if (whiteNoiseGainRef.current && whiteNoise) {
              whiteNoiseGainRef.current.gain.value = noiseVolume / 100 * 0.3;
            }
            if (brownNoiseGainRef.current && brownNoise) {
              brownNoiseGainRef.current.gain.value = noiseVolume / 100 * 0.3;
            }
          }, [noiseVolume]);
          
          useEffect(() => {
            if (!audioContextRef.current) return;
            
            if (clickTrack && leftFreq > 0 && rightFreq > 0) {
              const beatFreq = Math.abs(leftFreq - rightFreq);
              if (beatFreq < 0.5) return;
              
              const interval = 1000 / beatFreq;
              
              const playClick = () => {
                const ctx = audioContextRef.current;
                const now = ctx.currentTime;
                
                if (clickStyle === 'click') {
                  const osc = ctx.createOscillator();
                  const gain = ctx.createGain();
                  osc.connect(gain);
                  gain.connect(masterGainRef.current);
                  
                  osc.frequency.value = 1000;
                  gain.gain.setValueAtTime(clickVolume / 100 * 0.2, now);
                  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.002);
                  
                  osc.start(now);
                  osc.stop(now + 0.002);
                } else if (clickStyle === 'beep') {
                  const osc = ctx.createOscillator();
                  const gain = ctx.createGain();
                  osc.connect(gain);
                  gain.connect(masterGainRef.current);
                  
                  osc.frequency.value = 800;
                  gain.gain.setValueAtTime(clickVolume / 100 * 0.15, now);
                  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                  
                  osc.start(now);
                  osc.stop(now + 0.1);
                }
              };
              
              clickIntervalRef.current = setInterval(playClick, interval);
            } else {
              if (clickIntervalRef.current) {
                clearInterval(clickIntervalRef.current);
                clickIntervalRef.current = null;
              }
            }
            
            return () => {
              if (clickIntervalRef.current) {
                clearInterval(clickIntervalRef.current);
              }
            };
          }, [clickTrack, clickStyle, clickVolume, leftFreq, rightFreq]);
          
          useEffect(() => {
            if (leftOscRef.current) {
              leftOscRef.current.frequency.value = leftFreq;
            }
          }, [leftFreq]);
          
          useEffect(() => {
            if (rightOscRef.current) {
              rightOscRef.current.frequency.value = rightFreq;
            }
          }, [rightFreq]);
          
          useEffect(() => {
            if (masterGainRef.current) {
              masterGainRef.current.gain.value = volume / 200;
            }
          }, [volume]);
          
          useEffect(() => {
            if (leftGainRef.current) {
              leftGainRef.current.gain.value = leftMuted ? 0 : 1;
            }
          }, [leftMuted]);
          
          useEffect(() => {
            if (rightGainRef.current) {
              rightGainRef.current.gain.value = rightMuted ? 0 : 1;
            }
          }, [rightMuted]);
          
          const handleLeftChange = (value) => {
            const newLeft = parseFloat(value);
            setLeftFreq(newLeft);
            
            if (mode === 'locked') {
              const offset = lockedOffset;
              const newRight = newLeft >= rightFreq ? 
                Math.max(0, newLeft - offset) : 
                Math.min(700, newLeft + offset);
              setRightFreq(newRight);
            }
          };
          
          const handleRightChange = (value) => {
            const newRight = parseFloat(value);
            setRightFreq(newRight);
            
            if (mode === 'locked') {
              const offset = lockedOffset;
              const newLeft = newRight >= leftFreq ? 
                Math.max(0, newRight - offset) : 
                Math.min(700, newRight + offset);
              setLeftFreq(newLeft);
            }
          };
          
          const handleLockMode = () => {
            setLockedOffset(Math.abs(leftFreq - rightFreq));
            setMode('locked');
          };
          
          const setPreset = (left, right) => {
            setLeftFreq(left);
            setRightFreq(right);
            if (mode === 'locked') {
              setLockedOffset(Math.abs(left - right));
            }
          };
          
          const startSession = (sessionName) => {
            const phases = GATEWAY_SESSIONS[sessionName];
            setCurrentSession({ name: sessionName, phases, startTime: Date.now() });
            setCurrentPhase(0);
            setSessionActive(true);
            setLeftFreq(phases[0].left);
            setRightFreq(phases[0].right);
            
            sessionIntervalRef.current = setInterval(() => {
              updateSession(phases);
            }, 1000);
          };
          
          const updateSession = (phases) => {
            if (!sessionActive || !currentSession) return;
            
            const elapsed = (Date.now() - currentSession.startTime) / 1000;
            const totalDuration = phases.reduce((sum, p) => sum + p.duration, 0);
            
            let phaseStart = 0;
            let newPhase = currentPhase;
            
            for (let i = 0; i < phases.length; i++) {
              if (elapsed >= phaseStart && elapsed < phaseStart + phases[i].duration) {
                newPhase = i;
                break;
              }
              phaseStart += phases[i].duration;
            }
            
            if (elapsed >= totalDuration) {
              stopSession();
              return;
            }
            
            if (newPhase !== currentPhase) {
              setCurrentPhase(newPhase);
              setLeftFreq(phases[newPhase].left);
              setRightFreq(phases[newPhase].right);
            }
            
            const phaseElapsed = elapsed - phaseStart;
            const phaseRemaining = phases[newPhase].duration - phaseElapsed;
            const mins = Math.floor(phaseRemaining / 60);
            const secs = Math.floor(phaseRemaining % 60);
            setTimeRemaining(`${mins}:${secs.toString().padStart(2, '0')}`);
            setSessionProgress((elapsed / totalDuration) * 100);
          };
          
          const stopSession = () => {
            setSessionActive(false);
            setCurrentSession(null);
            setSessionProgress(0);
            setTimeRemaining('');
            setLeftFreq(0);
            setRightFreq(0);
            if (sessionIntervalRef.current) {
              clearInterval(sessionIntervalRef.current);
            }
          };
		  useEffect(() => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const beatFreq = Math.abs(leftFreq - rightFreq);
            
            const animate = () => {
              const width = canvas.width;
              const height = canvas.height;
              
              ctx.clearRect(0, 0, width, height);
              
              if (leftFreq === 0 && rightFreq === 0) {
                ctx.fillStyle = '#999999';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Set frequencies to see waveform', width / 2, height / 2);
                return;
              }
              
              ctx.strokeStyle = '#cccccc';
              ctx.setLineDash([2, 2]);
              ctx.beginPath();
              ctx.moveTo(0, height / 2);
              ctx.lineTo(width, height / 2);
              ctx.stroke();
              ctx.setLineDash([]);
              
              if (beatFreq === 0) {
                ctx.strokeStyle = '#0066cc';
                ctx.beginPath();
                ctx.moveTo(0, height / 2);
                ctx.lineTo(width, height / 2);
                ctx.stroke();
                
                ctx.fillStyle = '#666666';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('No binaural beat (frequencies equal)', width / 2, 20);
                return;
              }
              
              ctx.strokeStyle = '#0066cc';
              ctx.lineWidth = 2;
              ctx.beginPath();
              
              const numPoints = 200;
              const timeSpan = 3.0 / Math.max(beatFreq, 0.1);
              
              for (let i = 0; i < numPoints; i++) {
                const t = (i / numPoints) * timeSpan;
                const x = (i / numPoints) * width;
                const envelope = Math.cos(2 * Math.PI * beatFreq * t + wavePhase);
                const y = height / 2 - (envelope * (height / 2 - 20));
                
                if (i === 0) {
                  ctx.moveTo(x, y);
                } else {
                  ctx.lineTo(x, y);
                }
              }
              
              ctx.stroke();
              
              ctx.fillStyle = '#0066cc';
              ctx.font = 'bold 12px sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText(`Binaural Beat: ${beatFreq.toFixed(2)} Hz oscillation`, width / 2, 15);
              
              const state = getBrainwaveState();
              ctx.fillStyle = getStateColor(state.name);
              ctx.font = '11px sans-serif';
              ctx.fillText(`State: ${state.name}`, width / 2, height - 10);
              
              setWavePhase(prev => prev + 0.05);
              animationRef.current = requestAnimationFrame(animate);
            };
            
            animate();
            
            return () => {
              if (animationRef.current) {
                cancelAnimationFrame(animationRef.current);
              }
            };
          }, [leftFreq, rightFreq, wavePhase]);
          
          const beatFreq = Math.abs(leftFreq - rightFreq);
          const getBrainwaveState = () => {
            if (beatFreq <= 4) return { name: 'Delta', color: 'text-purple-600' };
            if (beatFreq <= 7) return { name: 'Theta', color: 'text-blue-600' };
            if (beatFreq <= 12) return { name: 'Alpha', color: 'text-green-600' };
            if (beatFreq <= 30) return { name: 'Beta', color: 'text-yellow-600' };
            return { name: 'Gamma', color: 'text-orange-600' };
          };
          
          const getStateColor = (name) => {
            const colors = {
              'Delta': '#9333ea',
              'Theta': '#2563eb',
              'Alpha': '#16a34a',
              'Beta': '#ca8a04',
              'Gamma': '#ea580c'
            };
            return colors[name] || '#666666';
          };
          
          const brainwaveState = getBrainwaveState();

          return (
            <div className="min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-50 p-4 md:p-8">
              <div className="max-w-4xl mx-auto">
                <div className="bg-white rounded-2xl shadow-xl p-6 mb-6">
                  <div className="flex items-center justify-between mb-2 flex-wrap gap-3">
                    <h1 className="text-3xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                      Human Tuning Fork
                    </h1>
                    <div className="flex gap-2">
                      <button
                        onClick={() => setShowNotes(true)}
                        className="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors"
                      >
                        <BookOpen size={18} />
                        Reference Notes
                      </button>
						  <a
                          href="https://www.paypal.com/donate" 
						  target="_blank"
						  rel="noopener noreferrer"
						  className="flex items-center gap-2 px-4 py-2 bg-pink-600 text-white rounded-lg hover:bg-pink-700 transition-colors"
						>
						  <Heart size={18} />
						  Donate
						</a>
                    </div>
                  </div>
                  <p className="text-gray-600 text-sm">
                    Gateway Process binaural beat generator for consciousness exploration
                  </p>
                </div>
                <div className="bg-white rounded-2xl shadow-xl p-6 mb-6">
                  <button
                    onClick={() => setShowBrainwaveGuide(!showBrainwaveGuide)}
                    className="flex items-center gap-2 text-lg font-semibold text-gray-800 w-full"
                  >
                    {showBrainwaveGuide ? <ChevronDown size={20} /> : <ChevronRight size={20} />}
                    🧠 Brainwave Frequency Guide
                  </button>
                  {showBrainwaveGuide && (
                    <div className="mt-4 space-y-2 text-sm text-gray-700">
                      <p><strong>Delta (0.5-4 Hz):</strong> Deep sleep, healing, unconscious mind access</p>
                      <p><strong>Theta (4-7 Hz):</strong> Deep meditation, creativity, intuition, dreamlike states</p>
                      <p><strong>Alpha (8-12 Hz):</strong> Relaxed awareness, visualization, calm focus, Gateway Focus 10</p>
                      <p><strong>Beta (12-30 Hz):</strong> Normal waking consciousness, alertness, active thinking</p>
                      <p><strong>Gamma (30-40 Hz):</strong> Peak focus, heightened perception, information processing</p>
                      <p className="mt-3 text-indigo-600">💡 Gateway Process uses Alpha/Theta for hemispheric synchronization</p>
                    </div>
                  )}
                </div>

                <div className="bg-white rounded-2xl shadow-xl p-6 mb-6">
                  <h2 className="text-xl font-semibold text-gray-800 mb-4">🎯 Gateway Process Sessions</h2>
                  
                  {sessionActive && currentSession && (
                    <div className="mb-4">
